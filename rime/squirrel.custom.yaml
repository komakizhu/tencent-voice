patch:
  style:
    color_scheme: blue_reverie
    color_scheme_dark: blue_reverie_dark
    status_message_type: mix
    candidate_format: '[label]. [candidate] [comment]'
    candidate_list_layout: stacked
    text_orientation: horizontal
    inline_preedit: true
    inline_candidate: false
    translucency: true
    blur: true
    mutual_exclusive: false
    memorize_size: true
    show_paging: false
    alpha: 1e+0
    corner_radius: 7e+0
    hilited_corner_radius: 0e+0
    border_height: -2e+0
    border_width: -2e+0
    line_spacing: 5e+0
    spacing: 8e+0
    shadow_size: 6e+0
    font_face: PingFangSC-Regular
    font_point: 1.6e+1

  # 颜色值沿用 Rime 的 BGR 顺序；8 位值为 AABBGGRR。
  # 这些配色不使用主题色描边，避免候选框外围出现彩色细框。
  "preset_color_schemes/blue_reverie":
    name: "Blue Reverie"
    author: HunterJi
    color_space: srgb
    back_color: '0xFFFFFF'
    hilited_back_color: '0x252320'
