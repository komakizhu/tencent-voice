name: macOS build and release

on:
  push:
    tags:
      - 'v*-macos'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Swift tests
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Run tests
        run: swift test

  build:
    name: Build macOS app
    needs: validate
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build and sign app
        env:
          CODESIGN_IDENTITY: '-'
        run: ./scripts/build-app.sh
      - name: Verify app signature
        run: codesign --verify --deep --strict dist/TencentVoiceMVP.app
      - name: Archive app
        shell: bash
        run: |
          version="dev-${GITHUB_RUN_NUMBER}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            version="${version%-macos*}"
          fi
          ditto -c -k --sequesterRsrc --keepParent \
            dist/TencentVoiceMVP.app \
            "TencentVoiceMVP-${version}-macos.zip"
      - name: Upload app archive
        uses: actions/upload-artifact@v4
        with:
          name: tencent-voice-macos
          path: TencentVoiceMVP-*-macos.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-macos') }}
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download app archive
        uses: actions/download-artifact@v4
        with:
          name: tencent-voice-macos
          path: release-assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          test "${#assets[@]}" -gt 0
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --verify-tag \
            --generate-notes \
            --title "TencentVoiceMVP ${GITHUB_REF_NAME}"
